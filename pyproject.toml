[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beats-respiratory-reliability"
version = "1.0.0"
description = "Tools for respiratory-sound classification, audio adaptation and predictive reliability"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "soundfile>=0.12,<1",
  "librosa>=0.11,<1",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "psutil>=6,<8",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "torchmetrics>=1.6,<2",
  "torchlibrosa>=0.1,<1",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

