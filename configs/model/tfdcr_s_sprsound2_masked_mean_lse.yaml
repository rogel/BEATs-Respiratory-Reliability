name: tfdcr_net_s_sprsound2_masked_mean_lse
mode: tfdcr
input_channels: 1
channels: [24, 48, 96, 160]
depths: [2, 2, 3, 2]
expansion_ratio: 2
kernel_size: 3
branches:
  standard: true
  temporal_difference: true
  frequency_difference: true
  joint_difference: false
learnable_static_branch_weights: true
temporal_dilations:
  - [1, 1]
  - [1, 1]
  - [1, 1, 1]
  - [1, 1]
pooling: masked_mean_lse
lse_temperature: 1.0
num_classes: 2
