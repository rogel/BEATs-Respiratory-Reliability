  dominant_domain_fraction_at_least: 0.65
  each_half_dominant_fraction_at_least: 0.60
  same_sign_blocks_at_least: 3
  dominant_norm_share_at_least: 0.55
  same_class_median_cosine_at_least: 0.20
  heterogeneity_median_at_least: 0.1823215567939546
  heterogeneity_block_median_at_least: 0.09531017980432493
  heterogeneity_blocks_at_least: 3
  weak_domain: icbhi2017
  known_strong_domain: sprsound2022
