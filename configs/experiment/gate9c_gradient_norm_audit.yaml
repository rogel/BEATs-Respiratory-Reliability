name: gate9c_gradient_norm_audit
seed: 20260729
train_value: train_fit
label_column: binary_label_id
batch_size: 8
num_views: 2

augmentation:
  gain_min: 0.8
  gain_max: 1.2
  noise_probability: 0.5
  snr_db_min: 12.0
  snr_db_max: 30.0
  shift_probability: 0.5
  max_shift_fraction: 0.1

audit:
  initialization_batches: 32
